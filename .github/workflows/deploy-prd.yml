name: Deploy PRD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: prd

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      # 3. AWS OIDC 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 4. AWS 인증 확인
      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # 5. 테스트
      - name: Test
        run: ./gradlew test

      # 6. JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # 7. ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Docker Build & Push
      - name: Build and Push Docker Image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_URI="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}"

          echo "======================================"
          echo "Building PRD image"
          echo "IMAGE: $IMAGE_URI:$SHORT_SHA"
          echo "======================================"

          docker build \
            --platform linux/arm64 \
            -t "$IMAGE_URI:$SHORT_SHA" \
            .

          docker push "$IMAGE_URI:$SHORT_SHA"

          echo "Pushed: $IMAGE_URI:$SHORT_SHA"

      # 9. PRD EC2 배포
      - name: Deploy to PRD EC2
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_URI="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}"

          echo "======================================"
          echo "Deploying PRD"
          echo "IMAGE: $IMAGE_URI:$SHORT_SHA"
          echo "INSTANCE: ${{ vars.EC2_INSTANCE_ID }}"
          echo "======================================"

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo \"[1/5] ECR login\"",
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com",
              "echo \"[2/5] Docker pull\"",
              "docker pull '"$IMAGE_URI:$SHORT_SHA"'",
              "echo \"[3/5] Stop old container\"",
              "docker stop haru-api || true",
              "echo \"[4/5] Remove old container\"",
              "docker rm haru-api || true",
              "echo \"[5/5] Start new container\"",
              "docker run -d --name haru-api --restart unless-stopped -p 8080:8080 --env-file /home/ec2-user/haru-api/.env '"$IMAGE_URI:$SHORT_SHA"'",
              "echo \"Deployment command completed\"",
              "docker ps --filter name=haru-api"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM command..."

          aws ssm wait command-executed \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            || true

          echo "======================================"
          echo "SSM RESULT"
          echo "======================================"

          aws ssm get-command-invocation \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{
              Status: Status,
              StatusDetails: StatusDetails,
              StandardOutput: StandardOutputContent,
              StandardError: StandardErrorContent
            }' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Final SSM status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "❌ PRD deployment failed"
            exit 1
          fi

          echo "✅ PRD deployment succeeded"

      # 10. 배포 결과 확인
      - name: Check deployment result
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "Checking deployment..."

          COMMAND_ID=$(aws ssm list-commands \
            --region "${{ vars.AWS_REGION }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Commands[0].CommandId" \
            --output text)

          aws ssm get-command-invocation \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"